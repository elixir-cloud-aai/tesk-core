version: 2
# No entry sets `target-branch`: pull requests go to the default branch
# (`dev`) anyway, and while `target-branch` is set, GitHub doesn't apply
# the entry's options (`labels`, `ignore`, ...) to security updates
updates:
  # Dependencies in `pyproject.toml` and the lock (`uv.lock`), updated
  # together; the images install the locked runtime dependencies
  - package-ecosystem: uv
    labels: ["type: dependencies"]
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    groups:
      # Dependencies of the documentation (the `docs` extra), in pull
      # requests of their own
      docs-dependencies:
        patterns: ["mkdocs", "mkdocs-*", "pymdown-extensions"]
      # Dependencies match the first group listed
      python-dependencies:
        patterns: ["*"]
  # Actions in the workflows, including the pins of the shared actions of
  # `elixir-cloud-aai/.github` (to the commits of its releases,
  # `@<commit> # vX.Y.Z`)
  - package-ecosystem: github-actions
    labels: ["type: dependencies"]
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  # Images in `containers/*.Dockerfile`, the base image and uv (tag and
  # digest)
  - package-ecosystem: docker
    labels: ["type: dependencies"]
    directory: /containers
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
  # Hook revisions in `.pre-commit-config.yaml`
  - package-ecosystem: pre-commit
    labels: ["type: dependencies"]
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]
