version: 2
# Every entry targets `dev` (`target-branch`), which takes all pull requests
# whatever the default branch is (`main` only moves forward to releases);
# security updates always target the default branch, though
updates:
  # Dependencies in `pyproject.toml` and the lock (`uv.lock`), updated
  # together; the images install the locked runtime dependencies
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    versioning-strategy: increase-if-necessary
    groups:
      # Dependencies of the documentation (the `docs` extra), in pull
      # requests of their own
      docs-dependencies:
        patterns: ["mkdocs", "mkdocs-*", "pymdown-extensions"]
      # Dependencies match the first group listed
      python-dependencies:
        patterns: ["*"]
  # Actions in the workflows, including the pins of the shared actions of
  # `elixir-cloud-aai/.github` (to the commits of its releases,
  # `@<commit> # vX.Y.Z`)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      github-actions:
        patterns: ["*"]
  # Images in `containers/*.Dockerfile`, the base image and uv (tag and
  # digest)
  - package-ecosystem: docker
    directory: /containers
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      docker:
        patterns: ["*"]
  # Hook revisions in `.pre-commit-config.yaml`
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      pre-commit:
        patterns: ["*"]
