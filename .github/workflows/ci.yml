# Everything that must pass on pull requests and pushes to `dev`: the pull
# request title, lint, the tests, the docs, a scan of the taskmaster and
# filer images for known vulnerabilities, and, on pushes, push each image by
# digest (with SBOM and provenance attestations), scan exactly that digest,
# then attest, sign (Sigstore) and tag it `dev` and `sha-<commit>`. Forks,
# which have none of the secrets, run the same checks without these side
# effects and without uploads to code scanning (as for pull requests from
# forks), unless they set the repository variable `DOCKERHUB_ORG` to publish
# to their own organization. `github.repository_owner == 'elixir-cloud-aai'`
# marks runs of the upstream repository. The gate `passed` ("CI passed") is
# the only required check. No `paths:` filters, so that the gate always
# reports; skip jobs with `if:` instead (and allow the skip in the gate).
# Runs also when a pull request is edited, so that the title check follows
# the title; all jobs run then, as a run that skipped the tests would report
# "CI passed" for the commit

name: CI
on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev]

permissions:
  contents: read

env:
  # "true" if this run publishes the images: pushes to this repository, or
  # to a fork that sets `DOCKERHUB_ORG` (and the Docker Hub secrets). Jobs'
  # `if:` can't read `env`, so `push` and `publish` repeat the expression
  PUBLISH: ${{ github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '') }}

# Cancel superseded runs of a pull request; runs for pushes get their own
# group, so that queued runs for successive pushes are not dropped. Runs for
# edits that leave the title unchanged (e.g., of the description, also by bots)
# share a group of their own, so that they cancel each other but not the run
# for the pull request's commit
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'push' && github.sha ||
      github.event.action == 'edited' && !github.event.changes.title &&
        format('{0}-edited', github.ref) ||
      github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Pull request titles become the commit messages on `dev` (squash
  # merges): Conventional Commits, at most 50 characters (shared action of
  # elixir-cloud-aai/.github, pinned to the commit of a release). Skipped on
  # pushes and for Dependabot, whose titles can't be configured to pass, unless
  # someone else edits the title
  title:
    name: PR title
    if: >-
      github.event_name == 'pull_request' && (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        github.event.changes.title &&
        github.event.sender.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check PR title
        uses: elixir-cloud-aai/.github/actions/pr-title@743e82d290a53768454999e413756a924e383259 # v1.0.0

  # The workflows (actionlint) and the package (pylint, errors only). The
  # package moves to `pyproject.toml`, ruff and mypy next (#67)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          docker run --rm --volume "${PWD}:/repo" --workdir /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color
      # `push` and `publish` repeat the expression of `PUBLISH` in their `if:`
      # (jobs' `if:` can't read `env`): all three must stay the same
      - name: Check publish conditions
        run: |
          expr="$(yq '.env.PUBLISH' .github/workflows/ci.yml)"
          for job in push publish; do
            if [[ "$(yq ".jobs.${job}.if" .github/workflows/ci.yml)" != "${expr}" ]]; then
              echo "::error::The if: of job '${job}' differs from env.PUBLISH"
              exit 1
            fi
          done
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install . pylint==4.1.3
      - name: Lint package
        run: python -m pylint --errors-only tesk_core

  # The tests of `tests/`, on every Python version that the package supports
  # (`setup.py`), with coverage to Codecov from the newest one
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # coverage 7.17 needs Python 3.11
      - name: Install dependencies
        run: python -m pip install --editable ".[test]" coverage==7.16.2
      - name: Calculate test coverage
        run: |
          coverage run --source=tesk_core -m pytest tests
          coverage report -m
          coverage xml
      # Upload errors fail pushes to this repository only, because forks,
      # pull requests from forks and Dependabot get no access to the Codecov
      # token
      - name: Submit report to Codecov
        if: ${{ matrix.python-version == '3.13' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: ${{ github.event_name == 'push' && github.repository_owner == 'elixir-cloud-aai' }}
          verbose: true

  # Builds these docs (`docs/`, `mkdocs.yml`) strictly: fails on warnings,
  # e.g. of broken links and anchors. They are published as part of the TESK
  # documentation, which includes `docs/`, not from here
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --requirement docs/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict

  # On pushes that publish (`PUBLISH`), builds each image once and pushes it
  # by digest only (untagged, with SBOM and provenance attestations), for
  # `scan` to scan and `publish` to sign and tag; the digests go to `scan` and
  # `publish` as artifacts, as the outputs of a matrix job can't tell its
  # entries apart. Digests of runs that fail are never signed or tagged, but
  # stay on Docker Hub, untagged
  push:
    name: Push image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same expression as `PUBLISH` (checked in `lint`)
    if: ${{ github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '') }}
    # Docker Hub secrets; the environment only allows branch `dev`
    environment: dev-images
    permissions:
      contents: read
    strategy:
      # Without both images, nothing is published
      fail-fast: true
      matrix:
        image: [taskmaster, filer]
    # Fully qualified (`docker.io/`), as the attestation needs it. The Docker
    # Hub organization is the variable `DOCKERHUB_ORG` (by default
    # `elixircloud`), so that the scan job, which has no secrets, scans the
    # image that is published
    env:
      IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/tesk-core-${{ matrix.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the image build derives the version from
          # them (`setuptools_scm`)
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI labels with the commit and source; the tags are set by `publish`,
      # after the scan
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=dev
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/${{ matrix.image }}.Dockerfile
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}
      - name: Save image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${DIGEST}" > "${RUNNER_TEMP}/digest.txt"
      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: ${{ runner.temp }}/digest.txt
          if-no-files-found: error
          # A re-run pushes a new digest, which replaces the earlier one
          overwrite: true

  # Scans each image with Trivy (shared action
  # `elixir-cloud-aai/.github/actions/scan-image`): a local build where
  # `PUBLISH` is "false" (pull requests, forks), otherwise exactly the digest
  # pushed by `push` (`<image>@<digest>`; public, so pulling it needs no
  # login), in a job without credentials or signing permissions, as the Trivy
  # action resolves the Trivy binary from a mutable tag. The findings that
  # have a fix are uploaded to code scanning (only in this repository, and not
  # for pull requests from forks, whose token cannot write them), and the job
  # fails on critical and high vulnerabilities that have a fix. Accepted
  # findings are listed, with a reason and an expiry date, in
  # `.trivyignore.yaml`
  scan:
    name: Scan image (${{ matrix.image }})
    # `push` is skipped (by its own `if:` only, as it needs no other job)
    # where `PUBLISH` is "false"; a failed or cancelled push skips the scan
    needs: push
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.push.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        image: [taskmaster, filer]
    env:
      IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/tesk-core-${{ matrix.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, as in `push`
          fetch-depth: 0
      # Named as the pushed image, so that code scanning matches the findings
      # of both
      - name: Build image
        if: ${{ env.PUBLISH != 'true' }}
        env:
          IMAGE: ${{ matrix.image }}
        run: docker build --file "containers/${IMAGE}.Dockerfile" --tag "${IMAGE_NAME}:scan" .
      - name: Download image digest
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}
          path: ${{ runner.temp }}
      - name: Determine image
        id: image
        run: |
          if [[ "${PUBLISH}" != "true" ]]; then
            echo "image=${IMAGE_NAME}:scan" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          digest="$(cat "${RUNNER_TEMP}/digest.txt")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${digest}'"
            exit 1
          fi
          echo "image=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          image: ${{ steps.image.outputs.image }}
          category: image-${{ matrix.image }}
          upload: ${{ github.repository_owner == 'elixir-cloud-aai' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}

  # Attests the build provenance of each scanned digest (GitHub artifact
  # attestation, also pushed to the registry), signs it with Sigstore keyless
  # signing (`cosign`, via the workflow's OIDC token) and only then tags
  # exactly that digest, so that the published images are the scanned ones
  publish:
    name: Publish image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same expression as `PUBLISH` (checked in `lint`)
    if: ${{ github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '') }}
    needs: [lint, test, docs, push, scan]
    # Docker Hub secrets; the environment only allows branch `dev`
    environment: dev-images
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    strategy:
      # A failed image cancels the other one where it can, so that the `dev`
      # tags of both images move together where possible. They can still
      # point to different commits for a while, e.g. if the branch moves on
      # between the two head checks, until the next push publishes both
      fail-fast: true
      matrix:
        image: [taskmaster, filer]
    # Publish one image of a kind at a time, and only for the newest commit on
    # the branch, so that an older run cannot overwrite `dev` with older code.
    # GitHub keeps one pending job per group: a newer one cancels it, so that
    # rapid pushes to `dev` can fail the gate of a skipped intermediate commit
    concurrency:
      group: ${{ github.workflow }}-publish-${{ matrix.image }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/tesk-core-${{ matrix.image }}
    steps:
      - name: Check that commit is still the branch head
        id: head
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          head=$(git ls-remote "https://github.com/${REPOSITORY}.git" "${REF}" | cut -f1)
          [ -n "${head}" ] || { echo "::error::Could not look up ${REF}"; exit 1; }
          if [ "${head}" = "${SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping publish: ${REF} has moved on to ${head}"
          fi
      - name: Download image digest
        if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}
          path: ${{ runner.temp }}
      - name: Read image digest
        if: steps.head.outputs.current == 'true'
        id: digest
        run: |
          digest="$(cat "${RUNNER_TEMP}/digest.txt")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${digest}'"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Attest build provenance
        if: steps.head.outputs.current == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        if: steps.head.outputs.current == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        if: steps.head.outputs.current == 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      # Tags `sha-<commit>` and then `dev` (never `latest`, which is for
      # releases) point to the scanned and signed digest: a single source is
      # copied as is. `dev` comes last, so that a failure leaves it at the
      # previous image, and only if the commit is still the branch head (it
      # may have moved on while signing)
      - name: Tag image
        if: steps.head.outputs.current == 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          tag_image() {
            local tag="$1" actual
            docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
            actual="$(docker buildx imagetools inspect "${tag}" \
              --format '{{ json .Manifest }}' | jq -r .digest)"
            if [[ "${actual}" != "${DIGEST}" ]]; then
              echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
              exit 1
            fi
          }
          tag_image "${IMAGE_NAME}:sha-${SHA}"
          head=$(git ls-remote "https://github.com/${REPOSITORY}.git" "${REF}" | cut -f1)
          [ -n "${head}" ] || { echo "::error::Could not look up ${REF}"; exit 1; }
          if [ "${head}" != "${SHA}" ]; then
            echo "::notice::Not tagging dev: ${REF} has moved on to ${head}"
            exit 0
          fi
          tag_image "${IMAGE_NAME}:dev"

  # The only required check: passes if every other job passed, or was skipped
  # where that is intended: `title` (pushes, Dependabot), `push` and `publish`
  # where `PUBLISH` is "false" (pull requests, and forks without
  # `DOCKERHUB_ORG`). Any other result (failure, cancelled, or an unintended
  # skip) fails it. Add every new job to `needs`
  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [title, lint, test, docs, push, scan, publish]
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          # `title` is skipped on purpose on pushes and for Dependabot, `push`
          # and `publish` where `PUBLISH` is "false" only
          allow-skipped: ${{ env.PUBLISH == 'false' && 'title push publish' || 'title' }}
