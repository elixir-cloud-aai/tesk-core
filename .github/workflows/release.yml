# Release when a version tag (`vX.Y.Z`, or `vX.Y.ZaN`, `vX.Y.ZbN`, `vX.Y.ZrcN`
# for pre-releases) is pushed: check the tag (signed, annotated, on
# `main`), the version in `CITATION.cff`, and that CI passed for
# its commit (`prepare`); build the taskmaster and filer images and push each by
# digest, untagged (`push`); scan exactly those digests in a job of their own,
# without the release credentials and signing identity (`scan`); and only then
# attest their build provenance, sign them (Sigstore keyless signing) and tag
# them `X.Y.Z` (and `latest`, for the highest stable release; `publish`). Tags
# of other releases are never touched. The package version is the tag's,
# passed to the image builds (`SETUPTOOLS_SCM_PRETEND_VERSION`) and checked in
# the images by `scan`, so no file but `CITATION.cff` has to be set. See
# "Versioning and releases" in `docs/development.md`.
#
# `push` and `publish` each need approval in the `release` environment
# (required reviewer). Re-running failed jobs reuses the digests already
# pushed. Re-running all jobs builds new digests, which `publish` refuses,
# before attesting and signing them, if `X.Y.Z` already points to another one:
# published versions never change. Only admins can create `v*` tags, and nobody
# can move or delete them (tag rulesets of the repository). `publish` runs one
# release at a time per image; a newer release waiting for it can cancel an
# older one that waits too (one pending job per concurrency group): re-run the
# failed jobs of that run.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One run per tag, so that a run waiting for approval is not cancelled by the
# run of another tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read the CI runs of the release commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and all tags, to check that the release commit is on
          # `main`
          fetch-depth: 0
      # Guards against accidental releases, e.g., of unmerged commits; the
      # `release` environment's protection rules (required reviewer) are what
      # actually control publishing. The first step, and runs no code of the
      # tagged commit (only Git and the GitHub API), so that nothing of the
      # commit runs before the tag is verified and the commit is on `main`
      - name: Check release tag and commit
        id: version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Canonical numbers only (no leading zeros), which PEP 440 keeps
          # as they are, so that the package version equals the tag's
          n='(0|[1-9][0-9]*)'
          if [[ ! "${TAG}" =~ ^v${n}\.${n}\.${n}((a|b|rc)${n})?$ ]]; then
              echo "::error::Tag '${TAG}' is not a release version (vX.Y.Z, or vX.Y.ZaN, vX.Y.ZbN, vX.Y.ZrcN for pre-releases)"
              exit 1
          fi
          # Annotated, with a signature that GitHub verified
          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
              echo "::error::Tag '${TAG}' is not annotated (git tag -s)"
              exit 1
          fi
          verified="$(gh api "repos/${REPOSITORY}/git/tags/$(git rev-parse "refs/tags/${TAG}")" \
              --jq .verification.verified)"
          if [[ "${verified}" != "true" ]]; then
              echo "::error::Tag '${TAG}' has no signature verified by GitHub (git tag -s)"
              exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release commit is not on 'main'"
              exit 1
          fi
          {
              echo "version=${TAG#v}"
              echo "sha=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"
      # Zenodo archives the release with the citation metadata of the tagged
      # commit, so `CITATION.cff` must have the release version (set in the
      # release-prep pull request)
      - name: Check citation metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cff="$(sed -En "s/^version:[[:space:]]*[\"']?([0-9A-Za-z.+-]+)[\"']?[[:space:]]*(#.*)?$/\1/p" CITATION.cff)"
          if [[ -z "${cff}" ]]; then
              echo "::error::CITATION.cff has no version: line; set it to '${VERSION}'"
              exit 1
          fi
          if [[ "${cff}" != "${VERSION}" ]]; then
              echo "::error::Version in CITATION.cff is '${cff}', expected '${VERSION}'"
              exit 1
          fi
      # The checks above don't run the tests: require a successful run of the
      # CI workflow for a push of the release commit (to `dev`, before it moved
      # to `main`); runs for pull requests test merge commits, not the commit
      # itself. Re-runs that succeeded count
      - name: Check that CI passed for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&status=success&per_page=1" \
              --jq .total_count)"
          if [[ ! "${runs}" =~ ^[0-9]+$ || "${runs}" -lt 1 ]]; then
              echo "::error::No successful run of the CI workflow (ci.yml) for a push of ${SHA}; once CI passed for it, re-run this workflow"
              exit 1
          fi

  # Builds each image of the release commit once and pushes it by digest only
  # (untagged, with SBOM and provenance attestations), for `scan` to scan and
  # `publish` to sign and tag; the digests go to `scan` and `publish` as
  # artifacts, as the outputs of a matrix job can't tell its entries apart.
  # Digests of runs that fail are never signed or tagged, but stay on Docker
  # Hub, untagged
  push:
    name: Push release image (${{ matrix.image }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Docker Hub secrets (required reviewer)
    environment: release
    permissions:
      contents: read
    strategy:
      # Without both images, nothing is published
      fail-fast: true
      matrix:
        image: [taskmaster, filer]
    # Fully qualified (`docker.io/`), as the attestation needs it. The Docker
    # Hub organization is the variable `DOCKERHUB_ORG` (by default
    # `elixircloud`), as in `ci.yml` and `scan.yml`
    env:
      IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/tesk-core-${{ matrix.image }}
    steps:
      # The commit checked by `prepare`; release tags cannot be moved (tag
      # ruleset)
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI labels with the version, commit and source; `tags` only sets the
      # version label (the image is tagged by digest in `publish`, after the
      # scan)
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/${{ matrix.image }}.Dockerfile
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}
          # The package version is the tag's, whatever `git describe` would
          # find (e.g., another tag on the same commit)
          build-args: SETUPTOOLS_SCM_PRETEND_VERSION=${{ needs.prepare.outputs.version }}
      - name: Save image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${DIGEST}" > "${RUNNER_TEMP}/digest.txt"
      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: ${{ runner.temp }}/digest.txt
          if-no-files-found: error
          # A re-run of all jobs pushes a new digest, which replaces the
          # earlier one
          overwrite: true

  # Scans exactly the pushed digests (public, so pulling them needs no login)
  # with Trivy (shared action `elixir-cloud-aai/.github/actions/scan-image`;
  # fails on fixable critical and high vulnerabilities, except those accepted
  # in `.trivyignore.yaml`), so that vulnerabilities published since CI
  # scanned the commit block the release. Kept apart from `push` and
  # `publish`, so that Trivy never runs next to the Docker Hub credentials
  # and the signing identity
  scan:
    name: Scan release image (${{ matrix.image }})
    needs: [prepare, push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [taskmaster, filer]
    env:
      IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/tesk-core-${{ matrix.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Download image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}
          path: ${{ runner.temp }}
      - name: Read image digest
        id: digest
        run: |
          digest="$(cat "${RUNNER_TEMP}/digest.txt")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${digest}'"
              exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          category: release-${{ matrix.image }}
          upload: "false"
      # The package in the image has the release version (PEP 440, as the
      # tag without `v`)
      - name: Check package version
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          actual="$(docker run --rm --entrypoint python3 "${IMAGE}" \
              -c 'import importlib.metadata as m; print(m.version("teskcore"))')"
          if [[ "${actual}" != "${VERSION}" ]]; then
              echo "::error::Package version in the image is '${actual}', expected '${VERSION}'"
              exit 1
          fi

  publish:
    name: Publish release image (${{ matrix.image }})
    needs: [prepare, push, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    strategy:
      # A failed image doesn't cancel the other one, which could only be cut
      # off between its tags (e.g., `X.Y.Z` without `latest`); re-run the
      # failed jobs to publish the rest (published versions never change)
      fail-fast: false
      matrix:
        image: [taskmaster, filer]
    # One release at a time per image, so that `latest` is decided and written
    # in one go
    concurrency:
      group: ${{ github.workflow }}-publish-${{ matrix.image }}
      cancel-in-progress: false
    env:
      IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/tesk-core-${{ matrix.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
          # All tags and `main`, to determine the highest release
          fetch-depth: 0
      - name: Download image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}
          path: ${{ runner.temp }}
      - name: Read image digest
        id: digest
        run: |
          digest="$(cat "${RUNNER_TEMP}/digest.txt")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${digest}'"
              exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # A published version never moves to another digest (e.g., after
      # "Re-run all jobs"): checked before attesting and signing, and failing
      # on any error other than a missing tag, so that a registry error can't
      # let it through
      - name: Check that the version is not published yet
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          if out="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" \
              --format '{{ json .Manifest }}' 2> inspect-error.txt)"; then
              existing="$(jq -r .digest <<< "${out}")"
              if [[ "${existing}" != "${DIGEST}" ]]; then
                  echo "::error::${IMAGE_NAME}:${VERSION} already exists with digest ${existing}"
                  exit 1
              fi
          elif ! grep -qi "not found" inspect-error.txt; then
              cat inspect-error.txt
              echo "::error::Could not check whether ${IMAGE_NAME}:${VERSION} exists"
              exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      # `X.Y.Z` and, for the highest stable release, `latest` point to the
      # scanned and signed digest. Decided last, from freshly fetched tags, so
      # that a re-run of an older release doesn't move `latest` back; only tags
      # on `main` count
      - name: Tag image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          git fetch --quiet --force --tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
          highest="$(git tag --merged origin/main --list 'v*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          tags=("${IMAGE_NAME}:${VERSION}")
          if [[ "v${VERSION}" == "${highest}" ]]; then
              tags+=("${IMAGE_NAME}:latest")
          fi
          for tag in "${tags[@]}"; do
              docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
              actual="$(docker buildx imagetools inspect "${tag}" \
                  --format '{{ json .Manifest }}' | jq -r .digest)"
              if [[ "${actual}" != "${DIGEST}" ]]; then
                  echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
                  exit 1
              fi
          done
