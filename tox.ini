[tox]
envlist =
  py{310,311,312,313}-unit,
  py{310,311,312,313}-lint
skip_missing_interpreters = True

[testenv]
deps =
  .[test]
  unit: coverage
  lint: pylint
commands =
  unit: coverage run --source=tesk_core -m pytest -v {posargs} tests
  unit: coverage report -m
  lint: python -m pylint --errors-only tesk_core
