# Docs of tesk-core, built strictly in CI (job `Docs`) only. The TESK
# documentation (https://tesk.readthedocs.io) includes `docs/` as its section
# "tesk-core" at build time, so pages link only to each other with relative
# links within `docs/`, and to everything else with full URLs, and use only
# the theme features and Markdown extensions that TESK's `mkdocs.yml` has.
site_name: tesk-core
site_description: >-
  Taskmaster and filer of TESK, the GA4GH Task Execution Service on
  Kubernetes, by ELIXIR On-Cloud
# The section of the TESK documentation that includes these pages
site_url: https://tesk.readthedocs.io/en/latest/tesk-core/
repo_url: https://github.com/elixir-cloud-aai/tesk-core
repo_name: elixir-cloud-aai/tesk-core
edit_uri: edit/dev/docs/
copyright: Copyright &copy; ELIXIR On-Cloud

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Taskmaster: taskmaster.md
  - Filer: filer.md
  - Development: development.md
