[build-system]
# The dependency group `build-system` lists the same requirements, which the
# image builds install from the lock
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "teskcore"
authors = [
    {name = "ELIXIR On-Cloud", email = "cloud-service@elixir-europe.org"},
    {name = "Erik van den Bergh"},
]
description = "Taskmaster and filer of TESK, the GA4GH TES on Kubernetes"
keywords = ["ga4gh", "tes", "task execution", "kubernetes", "elixir", "cloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# CI tests every version from this one to 3.13; the images use the Python of
# their Alpine base image (`containers/`)
requires-python = ">=3.10"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = [
    # 3.x and 2.x are the supported major versions of boto3 and urllib3
    "boto3>=1.28,<2",
    "kubernetes>=35.0.0,<38",
    "requests>=2.32.4,<3",
    "urllib3>=2.6.0,<3",
]

[project.optional-dependencies]
# Tests, lint and type checks; the local hooks of `.pre-commit-config.yaml`
# use these too
dev = [
    "boto3-stubs[s3]>=1.28",
    "coverage>=7.10",
    "fsspec>=2025.3",
    # moto 5 replaced `mock_s3`, which the S3 tests use
    "moto>=4.2,<6",
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pyfakefs>=5.9",
    "pytest>=8.4",
    "pytest-localftpserver>=1.3",
    "pytest-mock>=3.15",
    "ruff>=0.14",
    "types-requests>=2.32",
    # Locks the dependencies (`uv lock`, checked in CI); also the version of
    # uv that CI installs (`astral-sh/setup-uv`)
    "uv>=0.9",
]
# Documentation (`mkdocs.yml`), built strictly in CI; TESK's site includes
# `docs/` with its own dependencies. The packages that add warnings, which
# fail the strict build, are bounded by major version
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7,<10",
    "pymdown-extensions>=12.3,<13",
]

[dependency-groups]
# The build requirements (the same as `build-system.requires`), locked in
# `uv.lock` with their hashes, so that the image builds install them
# hash-checked instead of downloading them into an isolated build
# environment (`containers/`); Dependabot updates them with the other locked
# packages
build-system = ["setuptools>=77", "setuptools-scm>=8"]

[project.scripts]
filer = "tesk_core.filer:main"
taskmaster = "tesk_core.taskmaster:main"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
homepage = "https://github.com/elixir-cloud-aai/tesk-core"
Documentation = "https://tesk.readthedocs.io/en/latest/tesk-core/"

[tool.setuptools_scm]
# Version from Git tags (`vX.Y.Z`), the only place it is stored; the image
# builds get the Git metadata (`containers/`). Builds without it report the
# fallback unless `SETUPTOOLS_SCM_PRETEND_VERSION` is set
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# The rule set of the org's Python repos (foca, cloud-registry)
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle (docstrings)
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "G",    # flake8-logging-format
    "I",    # isort
    "PL",   # Pylint
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # Complexity limits, as in foca and cloud-registry
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
    "PLR2004",  # magic-value-comparison
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["tesk_core"]

[tool.ruff.lint.per-file-ignores]
# pytest checks with `assert`; the tests use fake paths under `/tmp` that are
# never written
"tests/**" = ["S101", "S108"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
# Complete type hints: all functions annotated, generic types parametrized
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true

# The Kubernetes client ships no type information
[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tesk_core"]
